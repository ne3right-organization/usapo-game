version: 1
backend:
  phases:
    preBuild:
      commands:
        # Next.js 16 は Node.js 20.9 以上が必要
        - nvm install 22
        - nvm use 22
        # npm ci はAmplifyのパッケージ(data-construct)が同梱するsemverとロックファイルが合わず失敗するため install を使う
        - npm install --no-audit --no-fund
    build:
      commands:
        # Cognito などのバックエンドをデプロイし、画面側が読む amplify_outputs.json を作る
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
