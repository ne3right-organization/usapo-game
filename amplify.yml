version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 は Node.js 20.9 以上が必要
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
